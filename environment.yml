name: hackathon
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - numpy>=1.26,<3
  - scipy
  - pip:
      # Quantum circuit simulation and optional IBM fake-device backends
      - qiskit
      - qiskit-aer
      - qiskit-ibm-runtime

      # Frontend-independent HTTP / JSON API
      - "fastapi[standard]"

      # Automated tests and API testing
      - pytest
      - httpx

      # QR codes for the cashier page
      - segno