<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#14121f">
    <title>Catino: Crowd</title>
    <link rel="icon" type="image/png" href="/crowd-assets/favicon.png">
    <link rel="apple-touch-icon" href="/crowd-assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #14121f;
            --card: #1f1c30;
            --line: #2f2a48;
            --text: #f6f2ff;
            --dim: #a49cc4;
            --orange: #ffa62e;
            --green: #4fe08a;
            --red: #ff5a6a;
            --blue: #7cc4ff
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Fredoka, system-ui, sans-serif;
            overscroll-behavior: none
        }

        body {
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
            padding: 14px 16px 20px;
            gap: 12px
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .5px
        }

        h1 span {
            color: var(--orange)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .dim {
            color: var(--dim);
            font-size: 14px
        }

        input {
            width: 100%;
            font: inherit;
            font-size: 20px;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid var(--line);
            background: #120f1c;
            color: var(--text);
            outline: none
        }

        input:focus {
            border-color: var(--orange)
        }

        button {
            font: inherit;
            font-weight: 700;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            color: #16121f;
            transition: transform .08s, opacity .2s
        }

        button:active {
            transform: scale(.97)
        }

        button:disabled {
            opacity: .35
        }

        .big {
            width: 100%;
            font-size: 24px;
            padding: 18px
        }

        .go {
            background: var(--orange)
        }

        .cash {
            background: var(--green);
            font-size: 30px;
            padding: 26px;
            box-shadow: 0 0 0 0 rgba(79, 224, 138, .6);
            animation: pulse 1s infinite
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 16px rgba(79, 224, 138, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(79, 224, 138, 0)
            }
        }

        .chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px
        }

        .chip {
            background: #2c2744;
            color: var(--text);
            font-size: 18px;
            padding: 12px 0
        }

        .chip.on {
            background: var(--orange);
            color: #16121f
        }

        #mult {
            font-size: 64px;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            margin: 6px 0 2px;
            font-variant-numeric: tabular-nums
        }

        #phaseText {
            text-align: center;
            font-size: 18px;
            color: var(--dim);
            min-height: 24px
        }

        #mood {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 4px 0 2px;
            min-height: 52px
        }

        #moodImg {
            width: 48px;
            height: 48px;
            image-rendering: pixelated
        }

        #mood b {
            display: block;
            font-size: 17px
        }

        #mood span {
            display: block;
            font-size: 14px;
            color: var(--dim);
            font-variant-numeric: tabular-nums
        }

        #mood.pop #moodImg {
            animation: moodpop .35s ease-out
        }

        #mood[data-mood=anxious] #moodImg,
        #mood[data-mood=panic] #moodImg {
            animation: moodshake .25s infinite
        }

        #mood[data-mood=sad] #moodImg {
            animation: moodbob 1.6s ease-in-out infinite
        }

        #mood[data-mood=panic] b {
            color: var(--red)
        }

        #mood[data-mood=win] b {
            color: var(--green)
        }

        @keyframes moodpop {
            0% {
                transform: scale(.5)
            }

            70% {
                transform: scale(1.2)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes moodshake {
            25% {
                transform: translateX(-2px)
            }

            75% {
                transform: translateX(2px)
            }
        }

        @keyframes moodbob {
            50% {
                transform: translateY(3px)
            }
        }


        .crashed #mult {
            color: var(--red)
        }

        .won #mult {
            color: var(--green)
        }

        #msg {
            text-align: center;
            min-height: 22px;
            font-size: 16px;
            color: var(--orange)
        }

        details.fold > summary { cursor: pointer; list-style: none; }
        details.fold > summary::-webkit-details-marker { display: none; }
        details.fold > summary b::before { content: "▸ "; color: var(--dim, #9a93b8); }
        details.fold[open] > summary b::before { content: "▾ "; }

        .list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 190px;
            overflow: auto
        }

        .item {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 10px;
            background: #18152a
        }

        .item.cashed {
            color: var(--green)
        }

        .item.burned {
            color: var(--red);
            text-decoration: line-through;
            opacity: .8
        }

        .item.me {
            outline: 2px solid var(--orange)
        }

        .hist {
            display: flex;
            gap: 6px;
            overflow: hidden
        }

        .pill {
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 99px;
            background: #2c2744
        }

        .pill.hi {
            color: var(--green)
        }

        .pill.lo {
            color: var(--red)
        }

        .boxline {
            width: 100%;
            margin-top: 10px;
            padding: 8px 10px;
            font-size: 14px;
            text-align: left;
            background: #231f38;
            color: var(--text);
            border: 2px solid var(--line);
            border-radius: 12px
        }

        .boxline.open {
            border-color: var(--orange)
        }

        .hidden {
            display: none !important
        }

        .bal {
            font-size: 20px;
            font-weight: 600
        }

        .season {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 14px;
            margin: 6px 0 8px;
            background: #2a2442;
            border: 1px solid var(--line)
        }

        .season span.next {
            display: block;
            margin-top: 2px;
            opacity: .8;
            font-size: 12px;
        }

        .season .ico {
            font-size: 30px;
            line-height: 1
        }

        .season b {
            display: block;
            font-size: 17px;
            letter-spacing: .3px
        }

        .season span {
            display: block;
            font-size: 14px;
            color: var(--dim);
            line-height: 1.25
        }

        .season.spring {
            background: linear-gradient(90deg, #3a2c4a, #2a2442);
            border-color: #ff9fd0
        }

        .season.summer {
            background: linear-gradient(90deg, #4a3a1c, #2a2442);
            border-color: #ffd23c
        }

        .season.fall {
            background: linear-gradient(90deg, #4a2a1c, #2a2442);
            border-color: #ff8a3c
        }

        .season.winter {
            background: linear-gradient(90deg, #1c2e4a, #2a2442);
            border-color: #9fd0ff
        }

        .cash.gold {
            background: linear-gradient(90deg, #ffd23c, #ffef9a);
            animation: pulse .5s infinite
        }

        #mult.storm {
            color: #ff9a3c;
            letter-spacing: 4px
        }

        .snd {
            display: flex;
            gap: 6px
        }

        .snd button {
            background: #2c2744;
            color: var(--text);
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 12px
        }

        .snd button.off {
            opacity: .35;
            text-decoration: line-through
        }

        #scene {
            display: block;
            width: 100%;
            height: 150px;
            border-radius: 14px;
            margin: 10px 0 4px;
            image-rendering: pixelated;
            cursor: pointer;
            background: #231f3a
        }

        /* ---------- wallet, demo checkout, play-safe tools (Phase 3) ---------- */
        .check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 16px;
            line-height: 1.3;
            cursor: pointer
        }

        .check input {
            width: 24px;
            height: 24px;
            flex: none;
            margin: 0;
            accent-color: var(--orange)
        }

        .sheet {
            position: fixed;
            inset: 0;
            background: rgba(8, 6, 16, .72);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
            padding: 10px
        }

        .tour { text-align: center; }
        .tour .stage { position: relative; height: 300px; border-radius: 16px; background: rgba(255,255,255,.05); overflow: hidden; margin: 6px 0 12px; }
        .tour .m { position: absolute; left: 0; right: 0; top: 14px; font-size: 54px; font-weight: 800; }
        .tour .cat { position: absolute; left: 18%; top: 120px; font-size: 64px; }
        .tour .fish { position: absolute; right: 16%; top: 150px; font-size: 44px; }
        .tour .bang { position: absolute; left: 24%; top: 80px; font-size: 40px; }
        .tour .face { position: absolute; right: 8%; top: 18px; font-size: 44px; }
        .tour .btn { position: absolute; right: 8%; bottom: 18px; width: 150px; height: 58px; border-radius: 14px; font-size: 30px; font-weight: 800; line-height: 58px; color: #17121f; }
        .tour .chip { position: absolute; left: 10%; bottom: 22px; width: 52px; height: 52px; border-radius: 50%; background: var(--orange, #ffa62e); font-weight: 800; line-height: 52px; color: #17121f; }
        .tour .paw { position: absolute; right: 12%; bottom: -6px; font-size: 40px; }
        .tour .coins { position: absolute; right: 10%; bottom: 84px; font-size: 32px; font-weight: 800; color: var(--green, #4fe08a); }
        .tour .nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .tour .nav button { width: 64px; }
        .tour .dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 5px; background: rgba(255,255,255,.25); }
        .tour .dots span.on { background: var(--orange, #ffa62e); }

        .sheet.hidden {
            display: none
        }

        .sheet .panel {
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow: auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .sheet h2 {
            margin: 0;
            font-size: 22px
        }

        .opt {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #2a2540;
            color: var(--text);
            border: 2px solid var(--line);
            text-align: left
        }

        .opt.on {
            border-color: var(--orange)
        }

        .ghost {
            background: transparent;
            color: var(--dim);
            border: 2px solid var(--line);
            padding: 12px;
            font-size: 16px;
            width: 100%
        }

        .demo {
            border: 2px dashed var(--orange);
            color: var(--orange);
            border-radius: 14px;
            padding: 10px;
            font-size: 15px;
            text-align: center
        }

        .warn {
            border: 2px solid var(--red);
            color: #ffd0d5;
            border-radius: 14px;
            padding: 10px;
            font-size: 15px
        }

        .kv {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 16px;
            border-bottom: 1px solid var(--line);
            padding: 6px 0
        }

        .tiny {
            font-size: 12px;
            color: var(--dim);
            word-break: break-all
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px
        }

        .grid3 button {
            padding: 12px 6px;
            font-size: 16px;
            background: #2a2540;
            color: var(--text)
        }

        .grid3 button.on {
            outline: 2px solid var(--orange)
        }

        #walletBtn {
            background: #2a2540;
            color: var(--text);
            padding: 6px 12px;
            font-size: 16px
        }
    </style>
</head>

<body>
    <div class="row">
        <h1><img src="/crowd-assets/logo_wordmark.png" alt="Catino" style="height:34px;width:auto;display:block"></h1>
        <div class="row" style="gap:10px">
            <div class="dim" id="count"></div>
            <div class="snd"><button id="musicBtn" title="music">🎵</button><button id="sfxBtn"
                    title="sounds">🔊</button></div>
        </div>
    </div>

    <!-- join -->
    <div id="joinView" class="card" style="display:flex;flex-direction:column;gap:12px">
        <div style="font-size:20px" data-t="join.intro">Bet on the cat with everyone in the room. Cash out before kitty gets distracted!</div>
        <input id="name" maxlength="12" placeholder="Your name" data-tp="join.name" autocomplete="off">
        <label class="check"><input type="checkbox" id="ageOk"> <span data-t="join.age">I am 19 or older.</span></label>
        <div class="dim" data-t="join.points">Points only, no real money. Play for fun and take breaks.</div>
        <button class="big go" id="joinBtn" disabled data-t="join.button">JOIN THE GAME</button>
        <button class="ghost" onclick="toggleLang()" data-t="lang.switch">Français</button>
        <div id="joinErr" class="dim" style="color:var(--red)"></div>
    </div>

    <!-- game -->
    <div id="gameView" class="hidden" style="display:flex;flex-direction:column;gap:12px">
        <div class="card" id="stage">
            <div class="row">
                <div class="dim" id="me"></div>
                <div class="row" style="gap:8px"><div class="bal" id="bal"></div><button id="walletBtn">👛 Wallet</button></div>
            </div>
            <canvas id="scene"></canvas>
            <div id="season" class="season hidden">
                <div class="ico" id="seasonIco"></div>
                <div><b id="seasonTitle"></b><span id="seasonRule"></span><span id="seasonNext" class="next"></span></div>
            </div>
            <div id="mult">1.00x</div>
            <div id="phaseText">Connecting…</div>
            <div id="mood" data-mood="calm"><img id="moodImg" src="/crowd-assets/mood_calm.png" alt="">
                <div><b id="moodLabel">Chillin'</b><span id="moodSub"></span></div>
            </div>
            <div class="hist" id="hist" style="margin-top:10px"></div>
            <button class="boxline hidden" id="boxBtn" onclick="openBox()"></button>
        </div>

        <div id="betBox" class="card" style="display:flex;flex-direction:column;gap:10px">
            <div class="chips">
                <button class="chip" data-v="1">1</button>
                <button class="chip on" data-v="5">5</button>
                <button class="chip" data-v="10">10</button>
                <button class="chip" data-v="25">25</button>
            </div>
            <button class="big go" id="betBtn">BET 5</button>
        </div>

        <button class="big cash hidden" id="cashBtn">CASH OUT</button>
        <div id="msg"></div>

        <details class="card fold" open>
            <summary class="row"><b data-t="walk.title">This walk</b><span class="dim" id="riders"></span></summary>
            <div class="list" id="players" style="margin-top:8px"></div>
        </details>
        <details class="card fold">
            <summary><b data-t="board.title">Leaderboard</b></summary>
            <div class="list" id="board" style="margin-top:8px"></div>
        </details>
        <button class="ghost" id="menuBtn" data-t="menu.button">☰ Menu: how to play, safe play, profile</button>
    </div>

    <!-- wallet / checkout / play-safe sheet -->
    <div id="sheet" class="sheet hidden">
        <div class="panel" id="sheetBody"></div>
    </div>

            flakes.forEach(f => { f.y += f.v * dt * dpr; f.x -= (speed * 0.6 + 10) * dt * dpr; if (f.x < 0) f.x += W; if (pc) { cx.fillStyle = pc; cx.fillRect(f.x, f.y, 3 * dpr, 3 * dpr); } });
            if (!season) flakes = [];

            // ground with moving dashes
            cx.fillStyle = ground; cx.fillRect(0, groundY, W, H - groundY);
            cx.fillStyle = "rgba(0,0,0,.25)";
            const dash = 28 * dpr, off = scroll % dash;
            for (let x = -off; x < W; x += dash) cx.fillRect(x, groundY + (H - groundY) * 0.45, dash * 0.5, 3 * dpr);

            // the cat
            const [name, t, fps, loop] = pickAnim(now);
            const [row, n] = ANIM[name];
            let f = Math.floor(t * fps); f = loop ? f % n : Math.min(n - 1, Math.max(0, f));
            const sc = Math.max(1, Math.round(H * 0.6 / 64)), cw = 120 * sc, ch = 64 * sc;
            const catX = Math.round(W * 0.42 - cw / 2), catY = Math.round(groundY - ch + 4 * dpr);
            const im = sheet(skin);
            if (im.complete && im.naturalWidth) cx.drawImage(im, f * 120, row * 64, 120, 64, catX, catY, cw, ch);

            // season events in the scene
            cx.textAlign = "center"; cx.textBaseline = "middle";
            if (s && s.phase === "running" && s.butterfly) {
                const bx = catX + cw * 0.75 + Math.sin(now / 260) * cw * 0.25, by = catY + ch * 0.1 + Math.sin(now / 130) * 10 * dpr;
                cx.save(); cx.shadowColor = "#ffd23c"; cx.shadowBlur = 18 * dpr;
                cx.font = `${30 * dpr}px system-ui`; cx.fillText("🦋", bx, by); cx.restore();
                for (let i = 0; i < 5; i++) { cx.fillStyle = `rgba(255,220,80,${0.8 - i * 0.15})`; cx.fillRect(bx - (i + 1) * 9 * dpr, by + Math.sin(now / 90 + i) * 6 * dpr, 3 * dpr, 3 * dpr); }
            }
            if (s && s.phase === "running" && s.leaf_storm) {
                for (let i = 0; i < 60; i++) {
                    const x = (i * 97.3 + now * 0.35 * (1 + (i % 5) * 0.3)) % (W + 40 * dpr) - 20 * dpr;
                    const y = (i * 53.7 + now * 0.08 * (1 + (i % 3))) % H;
                    cx.fillStyle = ["#ff8a3c", "#e8a33a", "#c4502a", "#ffb35c"][i % 4];
                    cx.save(); cx.translate(W - x, y); cx.rotate(now / 300 + i); cx.fillRect(-5 * dpr, -3 * dpr, 10 * dpr, 6 * dpr); cx.restore();
                }
            }

            if (s && s.phase === "crashed") {
                const p = PROP[s.distraction] || "❗", bob = Math.sin(now / 200) * 4 * dpr;
                cx.font = `${30 * dpr}px system-ui`; cx.fillText(p, catX + cw * 0.95, catY + ch * 0.25 + bob);
                banner("DISTRACTED!", "#ff5a6a", dpr, W);
            } else if (s && s.phase === "running" && s.you && s.you.cashed_at > 0) {
                banner("SAFE!  " + s.you.cashed_at.toFixed(2) + "x" + (s.you.bonus === "butterfly" ? " 🦋" : s.you.bonus === "cocoa" ? " ☕" : ""), "#4fe08a", dpr, W);
            } else if (s && s.phase === "running" && s.butterfly) {
                banner("GOLDEN BUTTERFLY! " + pct("butterfly"), "#ffd23c", dpr, W);
            } else if (s && s.phase === "running" && s.leaf_storm) {
                banner("LEAF STORM! 🍂", "#ff9a3c", dpr, W);
            } else if (s && s.phase === "running" && s.rush && walkTime() >= s.warmup && Math.floor(now / 300) % 2) {
                banner("☀️ SUMMER RUSH", "#ffd23c", dpr, W);
            } else if (s && s.phase === "running" && walkTime() < s.warmup) {
                banner("stretching…", "#ffffff", dpr, W);
            }
            const hintY = H - 9 * dpr;
            if (now < skinMsgUntil) { cx.font = `600 ${13 * dpr}px Fredoka, system-ui`; cx.fillStyle = "#fff"; cx.textAlign = "right"; cx.fillText("🐾 " + SKINS[skin - 1], W - 10 * dpr, hintY); }
            else if (!localStorage.getItem("kc_skin")) { cx.font = `${12 * dpr}px Fredoka, system-ui`; cx.fillStyle = "rgba(255,255,255,.75)"; cx.textAlign = "right"; cx.fillText("tap to change cat", W - 10 * dpr, hintY); }
        }

        function banner(text, color, dpr, W) {
            cx.font = `700 ${20 * dpr}px Fredoka, system-ui`; cx.textAlign = "center";
            cx.lineWidth = 5 * dpr; cx.strokeStyle = "rgba(0,0,0,.55)"; cx.strokeText(text, W / 2, 22 * dpr);
            cx.fillStyle = color; cx.fillText(text, W / 2, 22 * dpr);
        }

        (function sceneLoop(now) { drawScene(now); requestAnimationFrame(sceneLoop); })(performance.now());

        show(); poll(); startPolling(); connectLive(); requestAnimationFrame(frame);
    </script>
    <script>

            if (body !== undefined) headers["Content-Type"] = "application/json";
            if (idem) headers["Idempotency-Key"] = idem;
            const r = await fetch(path, { method, headers, cache: "no-store", body: body === undefined ? undefined : JSON.stringify(body) });
            const j = await r.json().catch(() => ({}));
            if (!r.ok && r.status !== 402) throw new Error(j.detail || "Network problem");
            return j;
        }
        function newKey() {
            const k = crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2);

        const until = t => t ? new Date(t).toLocaleString() : "";
        async function loadWallet() { WAL = await wapi("GET", "/api/wallet"); return WAL; }

        // wallet home
        async function openWallet() {

                <div class="tiny">$${t.min_dollars}-$${t.max_dollars} · ${t.points_per_dollar} points per $1 · $${t.left_today_dollars} of $${t.daily_cap_dollars} left today · simulated, no money moves</div>
                <input id="tuAmt" type="number" min="${t.min_dollars}" max="${Math.min(t.max_dollars, t.left_today_dollars)}" step="1" value="5" inputmode="numeric" oninput="tuPreview()" aria-label="Top-up amount in dollars">
                <button class="big go" ${t.available ? "" : "disabled"} onclick="openTopup()">TOP UP</button>

            const packs = WAL.demo_mode ? topup + WAL.products.map(p => `
                <button class="opt" ${p.available ? "" : "disabled"} onclick="openPay('${p.product_id}')">

            const lottery = L.enabled ? `

                <button class="big go" ${L.available ? "" : "disabled"} onclick="redeemTicket()">REDEEM TICKET</button>

            showPanel(`
                <div class="row"><h2>👛 Wallet</h2><button class="ghost" style="width:auto" onclick="closePanel()">✕</button></div>
                <div class="kv"><span>Balance</span><b>🪙 ${WAL.balance} points</b></div>
                <button class="big go" ${WAL.daily_free.available ? "" : "disabled"} onclick="claimDaily()">
                    ${WAL.daily_free.available ? "CLAIM " + WAL.daily_free.points + " FREE POINTS" : "FREE POINTS CLAIMED TODAY"}</button>
                <div id="dMsg" class="dim"></div>
                ${WAL.demo_mode ? '<div class="demo">DEMO MODE: payments are simulated. No real money is ever charged.</div>' : ""}
                ${packs}
                ${lottery}
                <button class="ghost" onclick="openProfile()">🐱 Profile &amp; cashier code</button>
                <button class="ghost" onclick="openHistory()">🧾 Receipts &amp; history</button>
                <button class="ghost" onclick="openSafe()">🛟 Play safe tools</button>`);
        }

        async function claimDaily() {
            try { const r = await wapi("POST", "/api/wallet/daily-free", {}); note("dMsg", `+${r.points} points! Balance ${r.balance}`); sfx("bonus"); setTimeout(openWallet, 900); poll(); }
            catch (e) { note("dMsg", e.message, true) }

            const code = ($("tCode").value || "").trim();
            if (!code) return;
            try {
                const r = await wapi("POST", "/api/wallet/lottery/redeem", { code }, newKey());
                note("tMsg", `+${r.points} points! Balance ${r.balance}`); sfx("bonus"); setTimeout(openWallet, 1200); poll();
            } catch (e) { note("tMsg", e.message, true); $("tCode").value = ""; }

        function tuDollars() { const d = Number($("tuAmt").value); return Number.isInteger(d) ? d : NaN; }

        function openPay(productId, dollars) {

            showPanel(`

                <div class="demo">SIMULATED PAYMENT · DEMO ONLY<br>No card is read and no real money is charged.</div>

        }
        function pickMethod(m) { payMethod = m; $("m_wallet").classList.toggle("on", m === "wallet"); $("m_card").classList.toggle("on", m === "card"); payReady(); }
        function payReady() { $("payBtn").disabled = !($("payOk").checked && payMethod); }
        async function pay(productId, dollars) {
            $("payBtn").disabled = true;
            try {
                const body = { product: productId, confirmed: true };
                if (productId === "topup") body.amount_dollars = dollars;
                const r = await wapi("POST", "/api/wallet/purchase", body, payKey);
                if (r.status !== "succeeded") { note("payMsg", "Demo payment declined. No points added.", true); $("payBtn").disabled = false; return; }

        function showReceipt(r) {
            showPanel(`

            showPanel(`

        // how to play without words: four animated slides (bet, the walk, cash out in time, distracted)
        let tourPage = 0, tourT0 = 0, tourTimer = null;
        function openTour() {
            try { localStorage.setItem("kc_tour", "1") } catch { }
            showPanel(`
                <div class="tour">
                    <div class="row"><span></span><button class="ghost" style="width:auto" onclick="closeTour()">✕</button></div>
                    <div class="stage" id="tStage">
                        <div class="m" id="tM">1.00x</div><div class="face" id="tFace">😺</div>

        function closeTour() { clearInterval(tourTimer); tourTimer = null; closePanel(); }
        function tourGo(p) {
            if (p > 3) { closeTour(); return; }
            tourPage = Math.max(0, p); tourT0 = performance.now();
            for (let i = 0; i < 4; i++) { const d = $("tDot" + i); if (d) d.className = i === tourPage ? "on" : ""; }
        }
        function tourTick() {
            if (!$("tStage") || !panelOpen()) { clearInterval(tourTimer); tourTimer = null; return; }
            const t = ((performance.now() - tourT0) / 1000) % 4, show = (id, on) => { $(id).style.visibility = on ? "visible" : "hidden" };
            const GREEN = "var(--green, #4fe08a)", ORANGE = "var(--orange, #ffa62e)", RED = "var(--red, #ff5a6a)";
            let m = 1, face = "😺", btn = GREEN, label = "10", coins = "", mColor = "";
            show("tFish", false); show("tBang", false); show("tPaw", true); show("tChip", true);
            $("tChip").style.transform = ""; $("tPaw").style.transform = "";
            $("tCat").style.transform = `translateX(${Math.sin(t * 3) * 12}px) translateY(${Math.abs(Math.sin(t * 9)) * -6}px) scaleX(-1)`;   // face the fish
            if (tourPage === 0) {                       // a paw taps BET, the chip jumps in
                $("tPaw").style.transform = `translateY(${-Math.abs(Math.sin(t * 3)) * 22}px)`;
                const k = Math.min(1, Math.max(0, (t - 1.6) * 2));

                btn = cashed ? GREEN : ORANGE; label = (10 * m).toFixed(0);
                $("tPaw").style.transform = cashed ? "" : `translateY(${-Math.abs(Math.sin(t * 4)) * 22}px)`;
                coins = cashed ? "+" + (10 * m).toFixed(0) : ""; face = cashed ? "😻" : "😺"; if (cashed) mColor = GREEN;
            } else {                                    // the cat sees a fish first: lost
                show("tPaw", false); m = Math.exp(0.35 * Math.min(t, 2.2)); const lost = t >= 2.2;
                show("tFish", t >= 1.6); show("tBang", lost); show("tChip", !lost);

            $("tCoins").textContent = coins;

        // profile + signed single-use cashier code
        const AVATAR_ICON = { ginger: "🟠", black: "⚫", white: "⚪", grey: "🔘", calico: "🟤", tabby: "🟡" };
        let qrTimer = null;
        async function openProfile() {
            let p;
            try { p = await wapi("GET", "/api/profile") } catch (e) { showPanel(`<div class="warn">${esc(e.message)}</div><button class="ghost" onclick="closePanel()">Close</button>`); return; }

            showPanel(`

                <button class="big go" onclick="saveProfile()">SAVE</button>

                <button class="opt" onclick="showQr()">Show my cashier code</button>

        function pickAvatar(a) { window.pfAvatar = a; document.querySelectorAll("[data-av]").forEach(b => b.classList.toggle("on", b.dataset.av === a)); }
        async function saveProfile() {
            try { const r = await wapi("PUT", "/api/profile", { nickname: $("pfName").value, avatar: window.pfAvatar }); note("pfMsg", `Saved as ${r.nickname}`); }
            catch (e) { note("pfMsg", e.message, true) }
        }
        async function showQr() {
            clearInterval(qrTimer);
            try {
                const q = await wapi("POST", "/api/profile/qr", {});
                const end = Date.now() + q.seconds * 1000;
                $("qrBox").innerHTML = `<div style="background:#fff;display:inline-block;padding:6px;border-radius:8px">${q.svg}</div>
                    <div class="kv"><span>Counter code</span><b style="letter-spacing:2px">${esc(q.counter_code)}</b></div><div id="qrLeft" class="tiny"></div>`;
                const tick = () => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); if ($("qrLeft")) $("qrLeft").textContent = left ? `Expires in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "Expired. Ask for a new code."; if ($("qrLeft")) $("qrLeft").textContent = fx($("qrLeft").textContent); if (!left || !$("qrLeft")) clearInterval(qrTimer); };
                tick(); qrTimer = setInterval(tick, 1000);
            } catch (e) { $("qrBox").innerHTML = `<div class="warn">${esc(e.message)}</div>` }
        }

        async function openHistory() {
            try {
                const [receipts, ledger] = await Promise.all([wapi("GET", "/api/wallet/receipts?limit=20"), wapi("GET", "/api/wallet/ledger?limit=30")]);
                const LABEL = { starting_grant: "Welcome points", daily_free: "Daily free", topup: "Demo top-up", parking_bundle: "Demo parking bundle", lottery_ticket: "Ticket bonus", wager: "Bet", payout: "Cash-out", refund: "Refund" };
                showPanel(`
                    <div class="row"><h2>🧾 History</h2><button class="ghost" style="width:auto" onclick="openWallet()">✕</button></div>
                    <b>Simulated receipts</b>
                    ${receipts.length ? receipts.map(r => `<div class="kv"><span>${esc(r.label)} · ${esc(r.status)}<br><span class="tiny">${esc(until(r.created_at))}</span></span><b>+${r.points}</b></div>`).join("") : '<div class="dim">No purchases.</div>'}
                    <b>Points ledger</b>
                    ${ledger.map(e => `<div class="kv"><span>${esc(LABEL[e.kind] || e.kind)}<br><span class="tiny">${esc(until(e.created_at))}</span></span><b>${e.amount_points > 0 ? "+" : ""}${e.amount_points} → ${e.balance_after}</b></div>`).join("")}
                    <button class="ghost" onclick="openWallet()">Back</button>`);
            } catch (e) { showPanel(`<div class="warn">${esc(e.message)}</div><button class="ghost" onclick="closePanel()">Close</button>`) }
        }

        // play-safe tools: every change goes to the server, which applies the rules
        async function openSafe() {
            let v;
            try { v = await wapi("GET", "/api/wallet/limits") } catch (e) { showPanel(`<div class="warn">${esc(e.message)}</div><button class="ghost" onclick="closePanel()">Close</button>`); return; }
            const pending = v.pending_limit ? `<div class="dim">Change waiting: ${v.pending_limit.daily_spend_limit_points ?? "no limit"} from ${esc(until(v.pending_limit.effective_at))}</div>` : "";
            const blocked = v.self_excluded_until ? `<div class="warn">Self-excluded until ${esc(until(v.self_excluded_until))}.</div>`
                : v.cooling_off_until ? `<div class="warn">Taking a break until ${esc(until(v.cooling_off_until))}.</div>` : "";
            showPanel(`
                <div class="row"><h2>🛟 Play safe</h2><button class="ghost" style="width:auto" onclick="closePanel()">✕</button></div>
                ${blocked}
                <b>Daily spend limit</b>
                <div class="dim">Now: ${v.daily_spend_limit_points ?? "none"} · spent today ${v.spent_today}${v.remaining_today != null ? " · " + v.remaining_today + " left" : ""}</div>
                ${pending}
                <input id="limitIn" type="number" min="1" inputmode="numeric" placeholder="Points per day">
                <div class="grid3"><button onclick="saveLimit(false)">Set</button><button onclick="saveLimit(true)">Remove</button><button onclick="openSafe()">↻</button></div>
                <div class="tiny">Lowering applies now. Raising or removing waits ${v.options.limit_increase_delay_hours} hours.</div>
                <div id="limMsg" class="dim"></div>
                <b>Reality check</b>
                <div class="grid3">${v.options.reality_check_minutes.map(m => `<button class="${m === v.reality_check_minutes ? "on" : ""}" onclick="setReality(${m})">every ${m} min</button>`).join("")}</div>
                <b>Take a break</b>
                <label class="check"><input type="checkbox" id="coolOk"> Pause betting and purchases. It can't be shortened.</label>
                <div class="grid3">${v.options.cool_off_hours.map(h => `<button onclick="coolOff(${h})">${h < 24 ? h + " hour" : h === 24 ? "1 day" : (h / 24) + " days"}</button>`).join("")}</div>
                <b>Self-exclusion</b>
                <div class="warn">Blocks all betting and purchases on this wallet for the whole period. It cannot be undone early.</div>
                <label class="check"><input type="checkbox" id="exclOk"> I understand and want to self-exclude.</label>
                <div class="grid3">${v.options.self_exclusion_days.map(d => `<button onclick="selfExclude(${d})">${d} days</button>`).join("")}</div>
                <div id="safeMsg" class="dim"></div>
                <div class="tiny">Need to talk to someone? ConnexOntario: 1-866-531-2600 or text CONNEX to 247247 (free, 24/7). Crisis: call or text 9-8-8.</div>`);
        }
        async function saveLimit(remove) {
            const n = parseInt($("limitIn").value, 10);
            if (!remove && !(n > 0)) { note("limMsg", "Enter a number of points.", true); return; }
            try { await wapi("PUT", "/api/wallet/limits", { daily_spend_limit_points: remove ? null : n }); openSafe(); }
            catch (e) { note("limMsg", e.message, true) }
        }
        async function setReality(m) {
            try { await wapi("PUT", "/api/wallet/limits", { reality_check_minutes: m }); rcNext = rcStart + m * 60000; openSafe(); }
            catch (e) { note("safeMsg", e.message, true) }
        }
        async function coolOff(h) {
            if (!$("coolOk").checked) { note("safeMsg", "Tick the box to start a break.", true); return; }
            try { await wapi("POST", "/api/wallet/cool-off", { hours: h, confirm: true }); openSafe(); }
            catch (e) { note("safeMsg", e.message, true) }
        }
        async function selfExclude(d) {
            if (!$("exclOk").checked) { note("safeMsg", "Tick the box to self-exclude.", true); return; }
            try { await wapi("POST", "/api/wallet/self-exclude", { days: d, confirm: true }); openSafe(); }
            catch (e) { note("safeMsg", e.message, true) }
        }

        // out of points: offer the ways back, including a break
        function walletOnState(st) {
            const you = st.you;
            if (!you || panelOpen() || st.phase !== "betting" || you.bet > 0 || you.balance >= 1 || oopRound === st.round_no) return;
            oopRound = st.round_no;
            loadWallet().then(() => showPanel(`
                <h2>Out of points</h2>
                <div class="dim">You can keep watching the walk. To play again:</div>
                ${WAL.daily_free.available ? `<button class="big go" onclick="claimDaily()">CLAIM ${WAL.daily_free.points} FREE POINTS</button><div id="dMsg" class="dim"></div>` : '<div class="dim">Free points are back tomorrow.</div>'}
                ${WAL.demo_mode || WAL.lottery.enabled ? '<button class="opt" onclick="openWallet()">Top up or enter a ticket</button>' : ""}
                <button class="opt" onclick="openSafe()">🛟 Take a break</button>
                <button class="ghost" onclick="closePanel()">Just watch</button>`)).catch(() => { });
        }

        // reality check: every N minutes (the player's choice, default 15) with the server's numbers
        async function startRealityCheck() {
            try { await loadWallet() } catch (e) { return }
            rcStart = Date.now(); rcNext = rcStart + WAL.responsible.reality_check_minutes * 60000;
            const since = WAL.server_time;
            setInterval(async () => {
                if (!pid || Date.now() < rcNext) return;
                try {
                    const [act, v] = await Promise.all([wapi("GET", "/api/wallet/activity?since=" + encodeURIComponent(since)), wapi("GET", "/api/wallet/limits")]);
                    rcNext = Date.now() + v.reality_check_minutes * 60000;
                    showPanel(`
                        <h2>⏰ Reality check</h2>
                        <div class="kv"><span>Playing for</span><b>${act.minutes} minutes</b></div>
                        <div class="kv"><span>Bets</span><b>${act.bets}</b></div>
                        <div class="kv"><span>Points bet</span><b>${act.wagered}</b></div>
                        <div class="kv"><span>Points won</span><b>${act.won}</b></div>
                        <div class="kv"><span>Net</span><b>${act.net > 0 ? "+" : ""}${act.net}</b></div>
                        <button class="big go" onclick="closePanel()">KEEP PLAYING</button>
                        <button class="opt" onclick="openSafe()">🛟 Take a break</button>
                        <button class="ghost" onclick="openHistory()">See my history</button>`);
                } catch (e) { }
            }, 20000);
        }

        $("walletBtn").onclick = openWallet;
        $("bal").onclick = openWallet;
        $("menuBtn").onclick = openMenu;
        $("sheet").onclick = e => { if (e.target.id === "sheet") closePanel(); };
        if (pid) startRealityCheck();
        else $("joinBtn").addEventListener("click", () => setTimeout(() => {
            if (!pid) return;
            startRealityCheck();
            let seen = true; try { seen = localStorage.getItem("kc_tour") === "1" } catch { }
            if (!seen && !panelOpen()) openTour();
        }, 800));
    </script>
</body>

</html>
