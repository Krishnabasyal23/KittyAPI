<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catino operator</title>
<style>
  :root {
    --surface-0:#f3f2ef; --surface-1:#fcfcfb; --border:#e2e0da;
    --text-primary:#22211f; --text-secondary:#55534d; --text-muted:#86837b;
    --grid:#ecebe7; --axis:#c9c6be;
    --series-1:#2a78d6; --series-2:#eb6834;
    --good:#1f8a4c; --critical:#d23c3c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0:#121211; --surface-1:#1a1a19; --border:#2e2d2a;
      --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8d84;
      --grid:#262624; --axis:#45443f;
      --series-1:#3987e5; --series-2:#d95926;
      --good:#3fb072; --critical:#e66767;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --surface-0:#121211; --surface-1:#1a1a19; --border:#2e2d2a;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8d84;
    --grid:#262624; --axis:#45443f;
    --series-1:#3987e5; --series-2:#d95926;
    --good:#3fb072; --critical:#e66767;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--surface-0); color:var(--text-primary); }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--surface-1); }
  header h1 { font-size:18px; margin:0; }
  header .muted { color:var(--text-muted); }
  header .spacer { flex:1; }
  a.btn, select { font:inherit; color:var(--text-primary); background:var(--surface-0); border:1px solid var(--border); border-radius:6px; padding:5px 10px; text-decoration:none; }
  main { max-width:1200px; margin:0 auto; padding:18px 20px 40px; display:grid; gap:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap:12px; }
  .tile, .card { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .tile .label { color:var(--text-secondary); font-size:13px; }
  .tile .value { font-size:28px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; }
  .tile .sub { color:var(--text-muted); font-size:12px; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap:16px; }
  .card h2 { font-size:15px; margin:0 0 2px; }
  .card .note { color:var(--text-muted); font-size:12px; margin:0 0 8px; }
  .legend { display:flex; gap:14px; color:var(--text-secondary); font-size:12px; margin-bottom:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .chart { position:relative; }
  .chart svg { width:100%; height:220px; display:block; }
  .tip { position:absolute; pointer-events:none; background:var(--surface-1); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.15); white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--text-secondary); font-weight:600; font-size:12px; }
  .ok { color:var(--good); } .bad { color:var(--critical); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Catino operator</h1>
  <span class="muted" id="stamp">Loading…</span>
  <span class="spacer"></span>
  <label class="muted">Days <select id="days"><option>7</option><option selected>14</option><option>30</option><option>90</option></select></label>
  <a class="btn" href="/api/operator/export/daily.csv?days=90">Daily CSV</a>
  <a class="btn" href="/api/operator/export/bets.csv">Bets CSV</a>
  <a class="btn" href="/api/operator/export/payments.csv">Payments CSV</a>
  <a class="btn" href="/api/operator/export/ledger.csv">Ledger CSV</a>
</header>
<main>
  <section class="tiles" id="tiles"></section>
  <section class="charts">
    <div class="card"><h2>Points wagered and paid back</h2><p class="note">Per day, all players (PC and phones)</p>
      <div class="legend"><span><i style="background:var(--series-1)"></i>Wagered</span><span><i style="background:var(--series-2)"></i>Paid back</span></div>
      <div class="chart" id="cWager"></div></div>
    <div class="card"><h2>RTP per day</h2><p class="note">Paid back ÷ wagered. Dashed line = 100%</p>
      <div class="chart" id="cRtp"></div></div>
    <div class="card"><h2>Top-ups per day</h2><p class="note">Simulated dollars, wallet screen and cashier together</p>
      <div class="chart" id="cTopup"></div></div>
  </section>
  <section class="card"><h2>Seasons</h2><div class="table-wrap"><table id="seasons"></table></div></section>
  <section class="card"><h2>Days</h2><div class="table-wrap"><table id="daily"></table></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = n => n == null ? "–" : Number(n).toLocaleString();
const pct = n => n == null ? "–" : n.toFixed(1) + "%";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

// bars: series = [{key, color}], rows = daily; line mode draws one series as a 2px line with dots
function chart(host, rows, series, opts = {}) {
  host.innerHTML = "";
  const W = host.clientWidth || 500, H = 220, L = 46, R = 10, T = 10, B = 26;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.label || "" }, host);
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; host.appendChild(tip);
  const vals = rows.flatMap(r => series.map(s => r[s.key] ?? 0));
  const max = niceMax(Math.max(opts.min || 0, ...vals));
  const y = v => T + (H - T - B) * (1 - v / max), slot = (W - L - R) / rows.length;
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    el("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: css(i ? "--grid" : "--axis"), "stroke-width": 1 }, svg);
    el("text", { x: L - 6, y: yy + 4, "text-anchor": "end", "font-size": 11, fill: css("--text-muted") }, svg).textContent = opts.unit === "%" ? v.toFixed(0) + "%" : fmt(Math.round(v));
  }
  const every = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => {
    if (i % every === 0) el("text", { x: L + slot * (i + 0.5), y: H - 8, "text-anchor": "middle", "font-size": 11, fill: css("--text-muted") }, svg).textContent = r.day.slice(5);
  });
  if (opts.ref != null) el("line", { x1: L, x2: W - R, y1: y(opts.ref), y2: y(opts.ref), stroke: css("--text-muted"), "stroke-dasharray": "4 4", "stroke-width": 1 }, svg);

  if (opts.line) {
    const s = series[0], pts = rows.map((r, i) => r[s.key] == null ? null : [L + slot * (i + 0.5), y(r[s.key])]);
    let d = ""; pts.forEach(p => { if (p) d += (d ? "L" : "M") + p[0] + " " + p[1]; });
    el("path", { d, fill: "none", stroke: css(s.color), "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    pts.forEach(p => p && el("circle", { cx: p[0], cy: p[1], r: 4, fill: css(s.color), stroke: css("--surface-1"), "stroke-width": 2 }, svg));
  } else {
    const gap = 2, inner = Math.min(28, slot * 0.8), bw = (inner - gap * (series.length - 1)) / series.length;
    rows.forEach((r, i) => series.forEach((s, j) => {
      const v = r[s.key] || 0; if (!v) return;
      const x = L + slot * (i + 0.5) - inner / 2 + j * (bw + gap), top = y(v), h = y(0) - top;
      const rad = Math.min(4, bw / 2, h);
      el("path", { d: `M${x} ${y(0)}V${top + rad}Q${x} ${top} ${x + rad} ${top}H${x + bw - rad}Q${x + bw} ${top} ${x + bw} ${top + rad}V${y(0)}Z`, fill: css(s.color) }, svg);
    }));
  }
  // hover: one hit area per day, bigger than the marks
  rows.forEach((r, i) => {
    const hit = el("rect", { x: L + slot * i, y: T, width: slot, height: H - T - B, fill: "transparent" }, svg);
    hit.addEventListener("mouseenter", () => {
      tip.innerHTML = `<b>${r.day}</b><br>` + series.map(s => `${s.name}: ${opts.unit === "%" ? pct(r[s.key]) : (opts.unit || "") + fmt(r[s.key])}`).join("<br>");
      tip.hidden = false;
      const x = L + slot * (i + 0.5);
      tip.style.left = Math.min(Math.max(0, x - tip.offsetWidth / 2), W - tip.offsetWidth) + "px";
      tip.style.top = "0px";
    });
    hit.addEventListener("mouseleave", () => tip.hidden = true);
  });
}

function tile(label, value, sub, cls) {
  return `<div class="tile"><div class="label">${label}</div><div class="value ${cls || ""}">${value}</div><div class="sub">${sub || ""}</div></div>`;
}

function table(id, cols, rows) {
  $(id).innerHTML = "<tr>" + cols.map(c => `<th>${c[0]}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + cols.map(c => `<td>${c[2] ? c[2](r[c[1]]) : r[c[1]]}</td>`).join("") + "</tr>").join("");
}

let last = null;
async function load() {
  try {
    const r = await fetch("/api/operator/summary?days=" + $("days").value, { cache: "no-store" });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    last = await r.json();
    draw(last);
    $("stamp").textContent = `v${last.version} · updated ${new Date().toLocaleTimeString()} · refreshes every 5 s`;
  } catch (e) { $("stamp").textContent = "Can't load: " + e.message; }
}

function draw(d) {
  const cashier = d.topups.by_provider.cashier || { dollars: 0, count: 0 };
  const wallet = d.topups.by_provider.fake || { dollars: 0, count: 0 };
  const issued = d.points.issued_by_kind;
  $("tiles").innerHTML = [
    tile("RTP today", pct(d.rtp.today), `all time ${pct(d.rtp.all_time)}`),
    tile("Bets today", fmt(d.bets.today), `${fmt(d.bets.all_time)} all time`),
    tile("Points wagered", fmt(d.bets.wagered), `${fmt(d.bets.paid)} paid back`),
    tile("Players", fmt(d.players.wallets), `${fmt(d.players.active_today)} active today · ${d.players.pc} PC, ${d.players.phone} phone`),
    tile("Top-ups today", "$" + fmt(d.topups.today_dollars), `${d.topups.today_count} today · all time $${fmt(wallet.dollars + cashier.dollars)} (cashier $${fmt(cashier.dollars)})`),
    tile("Points in wallets", fmt(d.points.in_wallets), `free ${fmt((issued.starting_grant || 0) + (issued.daily_free || 0))} · tickets ${fmt(issued.lottery_ticket || 0)}`),
    tile("Safe play", `${d.safe_play.cooling_off_now + d.safe_play.self_excluded_now}`, `on a break now · ${d.safe_play.daily_limits_set} daily limits set`),
    tile("Ledger", d.ledger_ok ? "✓ OK" : "✗ Check", d.ledger_ok ? "balances match the ledger" : "a balance differs from its ledger", d.ledger_ok ? "ok" : "bad"),
  ].join("");
  chart($("cWager"), d.daily, [{ key: "wagered", name: "Wagered", color: "--series-1" }, { key: "paid", name: "Paid back", color: "--series-2" }], { label: "Points wagered and paid back per day" });
  chart($("cRtp"), d.daily, [{ key: "rtp", name: "RTP", color: "--series-1" }], { line: true, unit: "%", ref: 100, min: 110, label: "RTP per day" });
  chart($("cTopup"), d.daily, [{ key: "topup_dollars", name: "Top-ups", color: "--series-1" }], { unit: "$", label: "Top-up dollars per day" });
  table("seasons", [["Season", "season"], ["Bets", "bets", fmt], ["Wagered", "wagered", fmt], ["Paid back", "paid", fmt], ["RTP", "rtp", pct]], d.rtp.by_season);
  table("daily", [["Day", "day"], ["Bets", "bets", fmt], ["Players", "players", fmt], ["Wagered", "wagered", fmt], ["Paid back", "paid", fmt], ["RTP", "rtp", pct], ["Top-ups", "topups", fmt], ["Top-up $", "topup_dollars", fmt], ["Top-up points", "topup_points", fmt]], [...d.daily].reverse());
}

$("days").onchange = load;
addEventListener("resize", () => last && draw(last));
load();
setInterval(load, 5000);
</script>
</body>
</html>
