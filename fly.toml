# Fly.io: fly launch --no-deploy --copy-config, fly volumes create catino_data --size 1,
# fly secrets set TICKET_SECRET=... QR_SECRET=... PUBLIC_URL=https://<app>.fly.dev, fly deploy.
app = "catino"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_MODE = "1"
  AUTO_HOST = "1"
  DEMO_MODE = "1"
  ALLOW_PUBLIC_DEMO = "1"
  KITTY_DB_PATH = "/data/catino-v2.db"
  PORT = "8001"

[mounts]
  source = "catino_data"
  destination = "/data"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
